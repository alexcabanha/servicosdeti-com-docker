services:

  traefik:
    image: traefik:v3.6.16
    container_name: traefik
    restart: unless-stopped

    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--ping=true"

    ports:
      - "80:80"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    networks:
      - frontend_net
      - monitoring_net

    mem_limit: 128m
    cpus: 0.50

    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./php/src:/var/www/html:ro
      - ./logs/nginx:/var/log/nginx

    depends_on:
      php:
        condition: service_healthy

    networks:
      - frontend_net
      - php_net

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=projeto-final_frontend_net"
      - "traefik.http.routers.helpdesk.rule=PathPrefix(`/`)"
      - "traefik.http.routers.helpdesk.entrypoints=web"
      - "traefik.http.services.helpdesk.loadbalancer.server.port=80"

    mem_limit: 128m
    cpus: 0.50

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


  php:
    build:
      context: ./php
      dockerfile: Dockerfile

    restart: unless-stopped

    volumes:
      - ./php/src:/var/www/html

    environment:
      APP_ENV: ${APP_ENV}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      API_INTERNAL_KEY: ${API_INTERNAL_KEY}

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - frontend_net
      - php_net
      - backend_net

    mem_limit: 256m
    cpus: 0.50

    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      APP_ENV: ${APP_ENV}
      API_PORT: ${API_PORT}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_PORT: ${REDIS_PORT}
      API_INTERNAL_KEY: ${API_INTERNAL_KEY}

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - frontend_net
      - backend_net

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=projeto-final_frontend_net"
      - "traefik.http.routers.backend.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.routers.backend.priority=100"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"

    mem_limit: 256m
    cpus: 0.50

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s


  mysql:
    image: mysql:8.4
    container_name: mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - backend_net

    mem_limit: 1g
    cpus: 1.00

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s


  redis:
    image: redis:alpine
    container_name: redis
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - redis_data:/data

    networks:
      - backend_net

    mem_limit: 256m
    cpus: 0.50

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped

    volumes:
      - grafana_data:/var/lib/grafana

    networks:
      - frontend_net
      - monitoring_net

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=projeto-final_frontend_net"
      - "traefik.http.routers.grafana.rule=PathPrefix(`/grafana`)"
      - "traefik.http.routers.grafana.entrypoints=web"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

    mem_limit: 512m
    cpus: 0.50


  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data

    networks:
      - frontend_net
      - monitoring_net

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=projeto-final_frontend_net"
      - "traefik.http.routers.portainer.rule=PathPrefix(`/portainer`)"
      - "traefik.http.routers.portainer.entrypoints=web"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"

    mem_limit: 256m
    cpus: 0.50


networks:

  frontend_net:
    driver: bridge

  php_net:
    driver: bridge
    internal: true

  backend_net:
    driver: bridge
    internal: true

  monitoring_net:
    driver: bridge


volumes:

  mysql_data:
    driver: local

  redis_data:
    driver: local

  grafana_data:
    driver: local

  portainer_data:
    driver: local