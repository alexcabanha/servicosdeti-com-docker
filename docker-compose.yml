services:

  traefik:
    image: traefik:v3.6.16
    container_name: traefik
    restart: unless-stopped

    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"

      # HTTP
      - "--entrypoints.web.address=:80"

      # HTTPS
      - "--entrypoints.websecure.address=:443"

      # Let's Encrypt / ACME
      - "--certificatesresolvers.letsencrypt.acme.email=alexcabanha@gmail.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"

      - "--ping=true"

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt

    networks:
      - frontend_net
      - monitoring_net

    mem_limit: 128m
    cpus: 0.50

    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s


  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./php/src:/var/www/html:ro
      - ./logs/nginx:/var/log/nginx

    depends_on:
      php:
        condition: service_healthy

    networks:
      - frontend_net
      - php_net

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=projeto-final_frontend_net"

  # Acesso pelo domínio + HTTPS
      - "traefik.http.routers.helpdesk.rule=Host(`helpdesk.alexcabanha.com.br`)"
      - "traefik.http.routers.helpdesk.entrypoints=websecure"
      - "traefik.http.routers.helpdesk.priority=100"
      - "traefik.http.routers.helpdesk.tls=true"
      - "traefik.http.routers.helpdesk.tls.certresolver=letsencrypt"
      - "traefik.http.services.helpdesk.loadbalancer.server.port=80"

  # Acesso pelo IP + HTTP
      - "traefik.http.routers.helpdesk-ip.rule=PathPrefix(`/`)"
      - "traefik.http.routers.helpdesk-ip.entrypoints=web"
      - "traefik.http.routers.helpdesk-ip.priority=1"
      - "traefik.http.routers.helpdesk-ip.service=helpdesk"

    mem_limit: 256m
    cpus: 0.75

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


  php:
    build:
      context: ./php
      dockerfile: Dockerfile

    restart: unless-stopped

    volumes:
      - ./php/src:/var/www/html

    environment:
      APP_ENV: ${APP_ENV}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      API_INTERNAL_KEY: ${API_INTERNAL_KEY}

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - frontend_net
      - php_net
      - backend_net

    mem_limit: 256m
    cpus: 0.50

    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      APP_ENV: ${APP_ENV}
      API_PORT: ${API_PORT}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_PORT: ${REDIS_PORT}
      API_INTERNAL_KEY: ${API_INTERNAL_KEY}

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - frontend_net
      - backend_net
      - monitoring_net

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=projeto-final_frontend_net"
      - "traefik.http.routers.backend.rule=Host(`helpdesk.alexcabanha.com.br`) && PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.priority=150"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"

    mem_limit: 512m
    cpus: 0.75

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s


  mysql:
    image: mysql:8.4
    container_name: mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - backend_net

    mem_limit: 1g
    cpus: 1.00

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s


  redis:
    image: redis:alpine
    container_name: redis
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - redis_data:/data

    networks:
      - backend_net

    mem_limit: 256m
    cpus: 0.50

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

    networks:
      - monitoring_net

    mem_limit: 512m
    cpus: 1.00

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:8080/healthz"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s


  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped

    command:
      - "--path.rootfs=/host"

    volumes:
      - /:/host:ro,rslave

    networks:
      - monitoring_net

    mem_limit: 256m
    cpus: 0.75

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:9100/metrics"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"

    networks:
      - monitoring_net

    mem_limit: 512m
    cpus: 1.00

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:9090/-/healthy"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s


  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped

    environment:
      GF_SERVER_ROOT_URL: "https://helpdesk.alexcabanha.com.br/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"

    volumes:
      - grafana_data:/var/lib/grafana

    networks:
      - frontend_net
      - monitoring_net

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=projeto-final_frontend_net"
      - "traefik.http.routers.grafana.rule=Host(`helpdesk.alexcabanha.com.br`) && PathPrefix(`/grafana`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.priority=200"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

    mem_limit: 1g
    cpus: 1


  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped

    command:
      - "--base-url=/portainer"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data

    networks:
      - frontend_net
      - monitoring_net

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=projeto-final_frontend_net"

      # /portainer -> /portainer/
      - "traefik.http.routers.portainer-slash.rule=Host(`helpdesk.alexcabanha.com.br`) && Path(`/portainer`)"
      - "traefik.http.routers.portainer-slash.entrypoints=websecure"
      - "traefik.http.routers.portainer-slash.priority=300"
      - "traefik.http.routers.portainer-slash.middlewares=portainer-slash"
      - "traefik.http.routers.portainer-slash.service=portainer"
      - "traefik.http.routers.portainer-slash.tls=true"
      - "traefik.http.routers.portainer-slash.tls.certresolver=letsencrypt"

      - "traefik.http.middlewares.portainer-slash.redirectregex.regex=^https?://([^/]+)/portainer$$"
      - "traefik.http.middlewares.portainer-slash.redirectregex.replacement=https://$${1}/portainer/"
      - "traefik.http.middlewares.portainer-slash.redirectregex.permanent=true"

      # Portainer
      - "traefik.http.routers.portainer.rule=Host(`helpdesk.alexcabanha.com.br`) && PathPrefix(`/portainer`)"
      - "traefik.http.routers.portainer.entrypoints=websecure"
      - "traefik.http.routers.portainer.priority=200"
      - "traefik.http.routers.portainer.middlewares=portainer-strip"
      - "traefik.http.middlewares.portainer-strip.stripprefix.prefixes=/portainer"
      - "traefik.http.routers.portainer.tls=true"
      - "traefik.http.routers.portainer.tls.certresolver=letsencrypt"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"

    mem_limit: 1g
    cpus: 1.00


networks:

  frontend_net:
    driver: bridge

  php_net:
    driver: bridge
    internal: true

  backend_net:
    driver: bridge
    internal: true

  monitoring_net:
    driver: bridge


volumes:

  mysql_data:
    driver: local

  redis_data:
    driver: local

  grafana_data:
    driver: local

  portainer_data:
    driver: local

  prometheus_data:
    driver: local